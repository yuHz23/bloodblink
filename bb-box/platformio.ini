; BB-Box — PlatformIO configuration for ESP32-S3 cold chain monitor
; Article 20 TT 26/2013/TT-BYT: two temperature threshold modes (storage vs transport)

[env:esp32-s3]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino

; Serial
monitor_speed = 115200
upload_speed = 921600

; Flash partition — 16 MB flash, 8 MB for app + LittleFS
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

; Compile flags
build_flags =
    -D BBBOX_VERSION=\"0.10.0\"
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_FREERTOS_HZ=1000
    ; I²C pins — bus 1 (core + shell sensors)
    -D I2C1_SDA=8
    -D I2C1_SCL=9
    ; I²C pins — bus 0 (shell sensor, alternate)
    -D I2C0_SDA=18
    -D I2C0_SCL=17
    ; Reed switch (door open)
    -D REED_PIN=4
    ; LIS3DH interrupt
    -D LIS3DH_INT1_PIN=5
    ; SPI flash (W25Q128)
    -D SPI_CS_PIN=10
    -D SPI_CLK_PIN=12
    -D SPI_MOSI_PIN=11
    -D SPI_MISO_PIN=13
    ; RGB LED
    -D LED_R_PIN=2
    -D LED_G_PIN=15
    -D LED_B_PIN=16
    ; Buzzer
    -D BUZZER_PIN=21

; Libraries
lib_deps =
    adafruit/Adafruit TMP117 Library@^1.0.0
    adafruit/Adafruit LIS3DH@^1.4.0
    adafruit/Adafruit BusIO@^1.16.1
    makuna/RTC@^2.4.0
    bblanchon/ArduinoJson@^7.2.0
    esphome/ESPAsyncWebServer@^3.2.0

; For native testing (desktop)
[env:native]
platform = native
build_flags =
    -D BBBOX_VERSION=\"0.10.0-test\"
    -D NATIVE_TEST
lib_deps =