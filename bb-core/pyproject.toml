[project]
name = "bb-core"
version = "0.1.0"
description = "BLOODBLINK Core — điều phối máu liên viện"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "geoalchemy2>=0.16",
    "shapely>=2.0",
    "httpx>=0.28",
    "numpy>=2.2",
    "faker>=33.0",
    "h3>=4.1",
    "apscheduler>=3.11",   # bộ lập lịch tự nâng vòng SOS
    "pyjwt>=2.10",         # token đăng nhập
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",   # tests/test_donors_sos.py chạy trên SQLite, không cần Postgres
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"